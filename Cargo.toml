[package]
name = "constellation-builder"
version = "0.1.0"
edition = "2024"

[dependencies]
constellation = { git = "https://github.com/IPNetworkingLab/constellation.git", version = "0.1.0" }
constellation-code = { git = "https://github.com/IPNetworkingLab/constellation-code.git", version = "0.1.0" }
handover-filter = { git = "https://github.com/IPNetworkingLab/handover-filter", version = "0.1.0" }

clap = { version = "4.6.1", features = ["derive"] }
dune-core = { git = "https://github.com/nrybowski/DUNE.git", tag = "v0.3.0" }
regex = "1.12.3"
toml = "0.8.23"
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
